apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ivolve
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 662371887858.dkr.ecr.eu-north-1.amazonaws.com/ivolve-frontend:2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ivolve-config
                  key: AUTH_SERVICE_URL
            - name: ROADMAP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ivolve-config
                  key: ROADMAP_SERVICE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ivolve-secret
                  key: SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ivolve
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: ivolve_affinity
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
