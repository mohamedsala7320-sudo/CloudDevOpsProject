apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: ivolve
  labels:
    app: roadmap-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roadmap-service
  template:
    metadata:
      labels:
        app: roadmap-service
    spec:
      containers:
        - name: roadmap-service
          image: 662371887858.dkr.ecr.eu-north-1.amazonaws.com/ivolve-roadmap-service:1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/roadmap
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: roadmap-service
  namespace: ivolve
  labels:
    app: roadmap-service
spec:
  type: ClusterIP
  selector:
    app: roadmap-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
